<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>My Design Admin</title>
<link rel="stylesheet" href="style.css"></head>
<body data-theme="dark-midnight"><main>
<h1>Inventory scanner</h1>
<input id="token" type="password" placeholder="Admin token">
<input id="qty" type="number" value="1" min="1" style="width:4rem">
<div><video id="cam" autoplay playsinline muted width="320"></video></div>
<button id="start">Start camera</button>
<div><input id="manual" placeholder="Or type barcode"><button id="add">Add stock</button></div>
<p id="out"></p>
</main><script type="module" src="admin.js"></script></body></html>
